<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .priority-high { border-left: 4px solid #ef4444; }
        .priority-medium { border-left: 4px solid #f59e0b; }
        .priority-low { border-left: 4px solid #10b981; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">My Tasks</h1>
            <p class="text-gray-600">Manage your daily activities</p>
        </header>

        <!-- Add Task Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <form id="taskForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" id="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" placeholder="What needs to be done?">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="description" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" placeholder="Add some details..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Priority</label>
                        <select id="priority" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Status</label>
                        <select id="status" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                            <option value="todo">Todo</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                    Add Task
                </button>
            </form>
        </div>

        <!-- Task List -->
        <div id="taskList" class="space-y-4">
            <!-- Tasks will be loaded here -->
            <div class="text-center py-8 text-gray-500">Loading tasks...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';

        // Fetch and display tasks
        async function fetchTasks() {
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                const tasks = await response.json();
                renderTasks(tasks || []);
            } catch (error) {
                console.error('Error fetching tasks:', error);
                document.getElementById('taskList').innerHTML = '<div class="text-red-500 text-center">Failed to load tasks. Is the backend running?</div>';
            }
        }

        function renderTasks(tasks) {
            const taskList = document.getElementById('taskList');
            if (!tasks || tasks.length === 0) {
                taskList.innerHTML = '<div class="text-center py-8 text-gray-500 bg-white rounded-lg shadow-sm">No tasks found. Add one above!</div>';
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="bg-white rounded-lg shadow-md p-4 flex items-center justify-between priority-${task.priority}">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <h3 class="text-lg font-semibold ${task.status === 'completed' ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</h3>
                            <span class="px-2 py-1 text-xs rounded-full ${getStatusBadgeClass(task.status)}">${task.status.replace('_', ' ')}</span>
                        </div>
                        <p class="text-gray-600 text-sm mt-1">${task.description || 'No description'}</p>
                    </div>
                    <div class="flex gap-2 ml-4">
                        ${task.status !== 'completed' ? `
                            <button onclick="updateStatus('${task.id}', 'completed')" class="p-2 text-green-600 hover:bg-green-50 rounded-full transition" title="Mark as Completed">
                                <i class="fas fa-check"></i>
                            </button>
                        ` : ''}
                        <button onclick="deleteTask('${task.id}')" class="p-2 text-red-600 hover:bg-red-50 rounded-full transition" title="Delete Task">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'todo': return 'bg-gray-100 text-gray-600';
                case 'in_progress': return 'bg-blue-100 text-blue-600';
                case 'completed': return 'bg-green-100 text-green-600';
                default: return 'bg-gray-100 text-gray-600';
            }
        }

        // Create Task
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const taskData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                priority: document.getElementById('priority').value,
                status: document.getElementById('status').value
            };

            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(taskData)
                });

                if (response.ok) {
                    document.getElementById('taskForm').reset();
                    fetchTasks();
                }
            } catch (error) {
                console.error('Error creating task:', error);
            }
        });

        // Update Status
        async function updateStatus(id, status) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    fetchTasks();
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        // Delete Task
        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                const response = await fetch(`${API_BASE}/tasks/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchTasks();
                }
            } catch (error) {
                console.error('Error deleting task:', error);
            }
        }

        // Initial load
        fetchTasks();
    </script>
</body>
</html>
